<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F5A800"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#0077CC"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Diamond accent left -->
  <polygon points="6,26 14,18 22,26 14,34" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="10,26 14,22 18,26 14,30" fill="#FFD700" opacity="0.4"/>

  <!-- META text -->
  <text
    x="30"
    y="38"
    font-family="'Rajdhani', 'Exo 2', 'Arial Black', sans-serif"
    font-weight="700"
    font-size="34"
    letter-spacing="2"
    fill="url(#goldGrad)"
    filter="url(#goldGlow)"
  >META</text>

  <!-- 888 text -->
  <text
    x="136"
    y="38"
    font-family="'Rajdhani', 'Exo 2', 'Arial Black', sans-serif"
    font-weight="700"
    font-size="34"
    letter-spacing="1"
    fill="url(#blueGrad)"
    filter="url(#blueGlow)"
  >888</text>

  <!-- Thin underline bar: gold to blue -->
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A800"/>
      <stop offset="100%" stop-color="#00AAFF"/>
    </linearGradient>
  </defs>
  <rect x="30" y="42" width="182" height="2" rx="1" fill="url(#barGrad)" opacity="0.7"/>
</svg>
